# Site Settings
title: "Personal Portfolio"
name: "Alex Mattei"
description: "Sports Data Analyst"
url: "https://aemattei215.github.io" 
baseurl: "" 

# Theme Configuration
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "mint" # Options: air, aqua, contrast, dark, dirt, neon, mint, sunrise

# Defaults for Layouts
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "single"
      author_profile: true # Shows your sidebar profile on all pages

author:
  name: "Alex Mattei"
  avatar: "/assets/images/githubpfp.jpg" # Path to your profile picture
  bio: "Sports statistics expert specializing in player evaluation and analysis."
  location: "Washington, DC - Philadelphia, PA"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://aemattei215.github.io"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "www.linkedin.com/in/alexander-mattei-813221284"

navigation: true
